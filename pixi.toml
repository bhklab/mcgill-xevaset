[workspace]
authors = ["Michael Tran <michaelcao-anh.tran@uhn.ca>"]
channels = ["conda-forge", "bioconda"]
name = "mcgill-xevaset"
platforms = ["linux-64", "osx-64"]
version = "0.1.0"

[activation]
env.CONFIG = "${PIXI_PROJECT_ROOT}/config"
env.RAWDATA = "${PIXI_PROJECT_ROOT}/data/rawdata"
env.PROCDATA = "${PIXI_PROJECT_ROOT}/data/procdata"
env.RESULTS = "${PIXI_PROJECT_ROOT}/data/results"
env.LOGS = "${PIXI_PROJECT_ROOT}/logs"
env.SCRIPTS = "${PIXI_PROJECT_ROOT}/workflow/scripts"

[dependencies]
air = ">=0.1.0,<1"
bioconductor-biobase = ">=2.70.0,<2.71"
bioconductor-multiassayexperiment = ">=1.36.0,<2"
bioconductor-s4vectors = ">=0.48.0,<0.49"
bioconductor-summarizedexperiment = ">=1.40.0,<2"
bioconductor-xeva = ">=1.26.0,<2"
python = ">=3.13,<3.14"
r-base = ">=4.5,<4.6"
"r-data.table" = ">=1.17.8,<2"
r-fs = ">=1.6.6,<2"
r-knitr = ">=1.50,<2"
r-patchwork = ">=1.3.2,<2"
r-rmarkdown = ">=2.30,<3"
r-scales = ">=1.4.0,<2"
r-yaml = ">=2.3.10,<3"
snakemake = ">=9.19.0,<10"
r-tidyverse = ">=2.0.0,<3"
bioconductor-biostrings = ">=2.78.0,<3"
bioconductor-genomicranges = ">=1.62.1,<2"
r-httr = ">=1.4.8,<2"
r-httr2 = ">=1.2.2,<2"
r-jsonlite = ">=2.0.0,<3"
r-checkmate = ">=2.3.3,<3"
r-crayon = ">=1.5.3,<2"
r-memoise = ">=2.0.1,<3"
r-readr = ">=2.2.0,<3"
r-xml2 = ">=1.5.2,<2"

[tasks]
qc = "Rscript -e \"rmarkdown::render('qc/mcgill_xeva_qc.Rmd', output_file = 'mcgill_xeva_qc.html', output_dir = 'qc', knit_root_dir = getwd())\""
